name: Tests
# Version Python (dossier python/) et générateur du site (dossier site/).
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt pyflakes
      - run: python -m pyflakes main.py ui.py ui_text.py ui_views.py ui_automation.py dialogs.py services.py display_geometry.py facefocus.py image_tools.py screen_splitter.py locales.py tests
      - run: python -m unittest discover -s tests -v
      - name: Le site se génère
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        working-directory: site
        run: |
          python -m pyflakes site_builder.py
          python site_builder.py
          git diff --exit-code -- html || (echo "site/html n'est pas à jour : lancez python site/site_builder.py" && exit 1)
