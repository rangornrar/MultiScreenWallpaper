name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt pyflakes
      - run: python -m pyflakes main.py ui.py ui_text.py dialogs.py services.py display_geometry.py facefocus.py image_tools.py screen_splitter.py locales.py tests
      - run: python -m unittest discover -s tests -v
