name: Microsoft Store (MSIX)
# Construit le paquet MSIX du Microsoft Store, l'installe sur le runner avec un certificat
# de test et vérifie qu'il fonctionne dans un paquet (dossier réel, fond d'écran, lancement
# au démarrage). Le paquet non signé est publié en artefact : c'est lui qu'on dépose dans
# Partner Center, qui le signe.
#
# L'identité du paquet vient des variables du dépôt (Settings > Secrets and variables >
# Actions > Variables) : MSIX_IDENTITY_NAME, MSIX_PUBLISHER, MSIX_PUBLISHER_DISPLAY_NAME,
# recopiées depuis Partner Center > WallCraft Pro > Identité du produit.
on:
  push:
    tags: ['v*', 'Tag_v*']
  pull_request:
    paths: ['python/**', 'tools/make_msix_assets.py', '.github/workflows/msix.yml']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (ex. 2026.11.14)'
        required: false
permissions:
  contents: read
env:
  IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME || 'WallCraftPro.Dev' }}
  PUBLISHER: ${{ vars.MSIX_PUBLISHER || 'CN=WallCraftDev' }}
  PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME || 'rangornrar' }}
jobs:
  msix:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: python
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt pyinstaller
      - name: Application en dossier (onedir)
        env:
          WALLCRAFT_ONEDIR: '1'
        run: pyinstaller --noconfirm WallCraft.spec
      - name: Version
        id: v
        run: |
          $v = "${{ github.ref_name }}" -replace '^(Tag_)?v', ''
          if ("${{ github.ref_type }}" -ne "tag") {
            $v = "${{ inputs.version }}"
            if (-not $v) { $v = Get-Date -Format "yyyy.M.d" }
          }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Paquet du Store (non signé)
        id: pack
        run: .\msix\build_msix.ps1 -Version ${{ steps.v.outputs.version }} -IdentityName $env:IDENTITY_NAME -Publisher $env:PUBLISHER -PublisherDisplayName $env:PUBLISHER_DISPLAY_NAME
      - uses: actions/upload-artifact@v4
        with:
          name: wallcraft-msix
          path: python/dist/WallCraft-Pro-*-Store.msix

      # --- Vérification du paquet installé ---
      - name: Paquet de test signé et installé
        run: |
          .\msix\build_msix.ps1 -Version ${{ steps.v.outputs.version }} -IdentityName $env:IDENTITY_NAME -Publisher $env:PUBLISHER -PublisherDisplayName $env:PUBLISHER_DISPLAY_NAME -OutDir dist/test -SignWithTestCert
          Import-Certificate -FilePath dist/test/WallCraft-test.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          Add-AppxPackage -Path (Get-ChildItem dist/test/*.msix).FullName
          Get-AppxPackage -Name $env:IDENTITY_NAME | Format-List Name, PackageFamilyName, InstallLocation, Version
      - name: Dossier réel, fond d'écran et tâche de démarrage dans le paquet
        run: |
          $report = Join-Path $env:RUNNER_TEMP "selftest.json"
          & "$env:LOCALAPPDATA\Microsoft\WindowsApps\wallcraft.exe" --selftest $report
          for ($i = 0; $i -lt 90 -and -not (Test-Path $report); $i++) { Start-Sleep 1 }
          if (-not (Test-Path $report)) { throw "Pas de rapport : l'application n'a pas démarré dans le paquet." }
          $r = Get-Content $report -Raw | ConvertFrom-Json
          $r | ConvertTo-Json -Depth 4
          if ($r.error) { throw "Erreur dans le paquet." }
          if (-not $r.packaged) { throw "L'application ne se voit pas dans un paquet." }
          if ($r.data_dir -notlike "*\Packages\*\LocalCache\Local\WallCraft") { throw "Dossier de données inattendu." }
          if (-not $r.startup_after_enable) { throw "La tâche de démarrage ne s'active pas." }
          if ($r.startup_after_disable) { throw "La tâche de démarrage ne se désactive pas." }
          if ($r.launched_at_startup) { throw "Un lancement en ligne de commande est pris pour un lancement au démarrage." }
          if (-not $r.wallpaper_set) { Write-Host "::warning::Le fond d'écran n'a pas pu être appliqué sur le runner." }
          elseif (-not ($r.wallpaper_now | Where-Object { $_ -like "$($r.data_dir)*" })) { throw "Windows n'affiche pas le fond depuis le dossier réel." }
      - name: L'application démarre depuis le menu Démarrer
        run: |
          $pfn = (Get-AppxPackage -Name $env:IDENTITY_NAME).PackageFamilyName
          Start-Process "shell:AppsFolder\$pfn!WallCraft"
          for ($i = 0; $i -lt 60 -and -not (Get-Process WallCraft -ErrorAction SilentlyContinue); $i++) { Start-Sleep 1 }
          Start-Sleep 15
          $p = Get-Process WallCraft -ErrorAction SilentlyContinue
          if (-not $p) { throw "WallCraft ne démarre pas ou s'arrête aussitôt dans le paquet." }
          $p | Format-Table Id, MainWindowTitle
          $p | Stop-Process -Force
